

apiVersion: v1
kind: ConfigMap
metadata:
  name: latencygroup1-config
  namespace: default
data:
  latencygroup1.yaml: |
    output:

    - name: topic-latency-2
      ratio: 1 

    - name: final-queue
      ratio: 1 

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: latency-1
  namespace: default
  labels:
    app: latency
    context: experience
    instance: latency-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latency
      context: experience
  template:
    metadata:
      labels:
        app: latency
        context: experience
    spec:
      containers:
        - name: latency-1
          image: docker.io/benneuville/binscale:latest
          imagePullPolicy: Always
          command: ["java", "$(JAVA_OPTS)", "-jar", "/app/consumer.jar"]
          ports:
            - containerPort: 8080
              name: brom
          env:
            - name: JAVA_OPTS
              value: "-Dnetworkaddress.cache.ttl=0 -Dnetworkaddress.cache.negative.ttl=0"
            - name: BOOTSTRAP_SERVERS
              value: my-cluster-kafka-bootstrap.default.svc.cluster.local:9092
            - name: TOPIC
              value: topic-latency-1
            - name: GROUP_ID
              value: latencygroup1
            - name: MESSAGE_COUNT
              value: "1000000"
            - name: CONSUMPTION_RATE
              value: "200"
            - name: SCALE
              value: "3"
            - name: SHAPE
              value: "2.75"
            - name: TIME_TO_COMMIT
              value: "50"
            - name: WSLA
              value: "500"
            - name: ASYNC_COMMIT
              value: "False"


            - name: PROCESSING_STRATEGY
              value: "custom"

            - name: TOPICS_DISTRIBUTION_CONFIG_PATH
              value: "/config/latencygroup1.yaml"
          volumeMounts:
            - name: latencygroup1-config
              mountPath: /config
      volumes:
        - name: latencygroup1-config
          configMap:
            name: latencygroup1-config

---


