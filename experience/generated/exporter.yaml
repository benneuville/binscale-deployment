apiVersion: v1
kind: ConfigMap
metadata:
  name: exporter-config
  namespace: default
data:
  exporter-config.yaml: |
    headers:

    - name: group_id
      default: unknown 

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exporter
  namespace: default
  labels:
    app: exporter
    context: experience
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exporter
      context: experience
  template:
    metadata:
      labels:
        app: exporter
        context: experience
    spec:
      containers:
        - name: exporter
          image: docker.io/benneuville/binscale:
          imagePullPolicy: Always
          command: ["java", "-jar", "/app/exporter.jar"]
          ports:
            - containerPort: 8080
              name: brom
          env:
            - name: BOOTSTRAP_SERVERS
              value: my-cluster-kafka-bootstrap:9092
            - name: MESSAGE_COUNTER_NAME
              value: 
#            - name: HEADERS_CONFIG_PATH
#              value: "/config/exporter-config.yaml"
          volumeMounts:
            - name: exporter-config
              mountPath: /config
      volumes:
        - name: exporter-config
          configMap:
            name: exporter-config