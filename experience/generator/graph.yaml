
nodes:
# producer input workload
  - id: workload-1
    type: workload
    params:
      workload: constant
      producer_ack: 0
      delay_ms: 600

# node consumers
  - id: latency-1
    type: latency
    params:
      group_id: latencygroup1
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      max_poll_records: 100
      processing_strategy: custom
  # - id: latency-2
  #   type: latency
  #   params:
  #     group_id: latencygroup2
  #     wsla: 500
  #     scale: 3
  #     shape: 2.75
  #     producer_ack: 0
  #     max_poll_records: 100
  # - id: latency-3
  #   type: latency
  #   params:
  #     group_id: latencygroup3
  #     wsla: 500
  #     scale: 3
  #     shape: 2.75
  #     producer_ack: 0
  #     max_poll_records: 100

# edges
edges:
  - from: workload-1
    to: latency-1
    weight: 1
    partitions: 10
  # - from: latency-1
  #   to: latency-2
  #   weight: 1
  #   partitions: 10
  # - from: latency-1
  #   to: latency-3
  #   weight: 1
  #   partitions: 10

controller:
  params:
  # maybe become a edge parameter
    fup: 0.8
    fdown: 0.3
  # #############################
    mu: 200
    wsla: 0.5
    rebalancing_time: 0.05
    polling_interval: 5000
    initial_size: 1
    scaling_strategy: naive
    metrics:
      request_time_range: "15s"