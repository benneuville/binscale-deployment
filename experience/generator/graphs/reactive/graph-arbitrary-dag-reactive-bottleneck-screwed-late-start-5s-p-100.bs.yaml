
nodes:
# producer input workload
  - id: workload-1
    type: workload
    params:
      workload: biased
      producer_ack: 0
      delay_ms: 600
  - id: workload-2
    type: workload
    params:
      workload: biased
      producer_ack: 0
      delay_ms: 600

# node consumers
  - id: latency-1
    type: latency
    params:
      group_id: latencygroup1
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 5 # rate of consumption : 200 events/second -> 5ms for a event
      processing_strategy: custom
  - id: latency-2
    type: latency
    params:
      group_id: latencygroup2
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 5 # rate of consumption : 200 events/second -> 5ms for a event
  - id: latency-3
    type: latency
    params:
      group_id: latencygroup3
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 5 # rate of consumption : 200 events/second -> 5ms for a event
  - id: latency-4
    type: latency
    params:
      group_id: latencygroup4
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 5 # rate of consumption : 200 events/second -> 5ms for a event
  - id: latency-5
    type: latency
    params:
      group_id: latencygroup5
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 100
      time_before_availability: 5000

# edges
edges:
  - from: workload-1
    to: latency-1
    weight: 1
  - from: workload-2
    to: latency-2
    weight: 0.8
  - from: latency-1
    to: latency-2
    weight: 0.5
  - from: latency-1
    to: latency-3
    weight: 1
  - from: latency-2
    to: latency-5
    weight: 1.5
  - from: latency-3
    to: latency-5
    weight: 1
  - from: latency-3
    to: latency-4
    weight: 0.2
  - from: latency-4
    to: latency-5
    weight: 1

controller:
  params:
    decision_interval: 1000
  # maybe become a edge parameter
    fup: 0.9
    fdown: 0.4
  # #############################
    rebalancing_time: 0.5
    initial_size: 1
    scaling_strategy: reactive 
    metrics:
      request_time_range: 5
      request_time_unit: "s" # "s", "m", "h"