
nodes:
# producer input workload
  - id: workload-ehanced-1
    type: workload
    params:
      workload: biased
      producer_ack: 0
      delay_ms: 600
  - id: workload-ehanced-2
    type: workload
    params:
      workload: biased
      producer_ack: 0
      delay_ms: 600

# node consumers
  - id: latency-ehanced-1
    type: latency
    params:
      group_id: latencyehancedgroup1
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 200
      processing_strategy: custom
  - id: latency-ehanced-2
    type: latency
    params:
      group_id: latencyehancedgroup2
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 200
      processing_strategy: custom
  - id: latency-ehanced-3
    type: latency
    params:
      group_id: latencyehancedgroup3
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 200
      processing_strategy: custom
  - id: latency-ehanced-4
    type: latency
    params:
      group_id: latencyehancedgroup4
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 200
      processing_strategy: custom
  - id: latency-ehanced-5
    type: latency
    params:
      group_id: latencyehancedgroup5
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 5 # rate of consumption : 200 events/second -> 5ms for a event

# edges
edges:
  - from: workload-ehanced-1
    to: latency-ehanced-1
    weight: 1
  - from: workload-ehanced-2
    to: latency-ehanced-2
    weight: 1
  - from: latency-ehanced-1
    to: latency-ehanced-2
    weight: 0.2
  - from: latency-ehanced-1
    to: latency-ehanced-3
    weight: 0.8
  - from: latency-ehanced-2
    to: latency-ehanced-5
    weight: 0.2
  - from: latency-ehanced-3
    to: latency-ehanced-5
    weight: 1
  - from: latency-ehanced-3
    to: latency-ehanced-4
    weight: 0.2
  - from: latency-ehanced-4
    to: latency-ehanced-5
    weight: 1

controller:
  params:
    decision_interval: 1500
  # maybe become a edge parameter
    fup: 0.9
    fdown: 0.4
  # #############################
    rebalancing_time: 0.5
    initial_size: 1
    scaling_strategy: ehanced 
    metrics:
      request_time_range: 5
      request_time_unit: "s" # "s", "m", "h"