#
#   GOAL OF EXPERIENCE:
#   Test the propagation of effort through a graph
#   In the hypothesis that propagation calculation are correct because of node current arrival rate suppression in Binpack application
#
#   EXPERIENCE DESCRIPTION:
#
#   latency-1 is normally loaded [10 partitions]
#
#   latency-2 overloaded (by 2 input workloads) [15 partitions]
#
#
#   EXPERIENCE RESULT ESTIMATION:
#   latency-1 arrival rate will overide latency-2 and make miscalculation in scaling decision


nodes:
# producer input workload
  - id: workload-1
    type: workload
    params:
      workload: biased
      producer_ack: 0
      delay_ms: 600
  - id: workload-2
    type: workload
    params:
      workload: biased
      producer_ack: 0
      delay_ms: 600
  - id: workload-3
    type: workload
    params:
      workload: biased
      producer_ack: 0
      delay_ms: 600

# node consumers
  - id: latency-1
    type: latency
    params:
      group_id: latencygroup1
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 200
      processing_strategy: custom
  - id: latency-2
    type: latency
    params:
      group_id: latencygroup2
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 15
      consumption_rate: 200
  - id: latency-3
    type: latency
    params:
      group_id: latencygroup3
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 200
  - id: latency-4
    type: latency
    params:
      group_id: latencygroup4
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 200

# edges
edges:
  - from: workload-1
    to: latency-1
    weight: 1
  - from: workload-2
    to: latency-2
    weight: 1
  - from: workload-3
    to: latency-2
    weight: 1
  - from: latency-1
    to: latency-2
    weight: 0.1
  - from: latency-1
    to: latency-3
    weight: 0.3
  - from: latency-2
    to: latency-4
    weight: 1

controller:
  params:
  # maybe become a edge parameter
    fup: 0.9
    fdown: 0.4
  # #############################
    rebalancing_time: 0.5
    initial_size: 1
    scaling_strategy: ehanced # naive, ehanced
    metrics:
      request_time_range: 5
      request_time_unit: "s" # "s", "m", "h"