
nodes:
# producer input workload
  - id: workload-1
    type: workload
    params:
      workload: biased
      producer_ack: 0
      delay_ms: 600

# node consumers
  - id: latency-1
    type: latency
    params:
      group_id: latencygroup1
      wsla: 500
      scale: 3
      shape: 2.75
      producer_ack: 0
      partitions: 10
      consumption_rate: 200
      processing_strategy: custom

# edges
edges:
  - from: workload-1
    to: latency-1
    weight: 1

controller:
  params:
  # maybe become a edge parameter
    fup: 0.9
    fdown: 0.6
  # #############################
    rebalancing_time: 0.5
    initial_size: 1
    scaling_strategy: ehanced
    metrics:
      request_time_range: 5
      request_time_unit: "s" # "s", "m", "h"