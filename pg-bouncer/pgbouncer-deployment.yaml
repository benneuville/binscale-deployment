apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:latest
        ports:
        - containerPort: 6432
        env:
        - name: LISTEN_ADDR
          value: "*"
        - name: LISTEN_PORT
          value: "6432"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "analyzer"
        - name: DB_USER
          value: "analyzer"
        - name: PGBOUNCER_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POOL_MODE
          value: "session"
        - name: MAX_CLIENT_CONN
          value: "500"
        - name: DEFAULT_POOL_SIZE
          value: "100"
        - name: RESERVE_POOL_SIZE
          value: "50"
        - name: RESERVE_POOL_TIMEOUT
          value: "5"
        volumeMounts:
        - name: pgbouncer-config
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
      volumes:
      - name: pgbouncer-config
        configMap:
          name: pgbouncer-userlist
---
# ConfigMap pour les identifiants
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-userlist
  namespace: default
data:
  userlist.txt: |
    "analyzer" "password123"