apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  labels:
    app: postgres
data:
  POSTGRES_DB: "analyzer"
  POSTGRES_USER: "analyzer"
  PGDATA: "/var/lib/postgresql/data/pgdata"  # Répertoire des données
  postgresql.conf: |
    max_connections = 200
    shared_buffers = 4GB
    effective_cache_size = 12GB
    work_mem = 16MB
    maintenance_work_mem = 512MB
    random_page_cost = 1.1