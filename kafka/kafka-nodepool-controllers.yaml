apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: my-cluster-controllers
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: ephemeral
  template:
    pod:
      metadata:
        labels:
          app.kubernetes.io/component: kafka-controller
      terminationGracePeriodSeconds: 30