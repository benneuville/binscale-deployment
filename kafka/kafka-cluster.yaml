apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  namespace: default
  annotations:
    strimzi.io/kraft: "true"
spec:
  kafka:
    version: 4.1.0
    metadataVersion: "4.1"
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      process.roles: broker,controller
      node.id: 1
      controller.quorum.voters: "1@my-cluster-controllers-0.my-cluster-controllers.default.svc.cluster.local:9093,2@my-cluster-controllers-1.my-cluster-controllers.default.svc.cluster.local:9093,3@my-cluster-controllers-2.my-cluster-controllers.default.svc.cluster.local:9093"
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    storage:
      type: ephemeral
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml

  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"

  entityOperator:
    topicOperator: {}
    userOperator: {}
